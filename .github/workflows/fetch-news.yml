name: Daily Content Generate

on:
  schedule:
    # 매일 오전 7시 (KST) = UTC 22:00 (전날)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 버튼 + 교과 강제 옵션
    inputs:
      subject:
        description: '강제 교과 (비우면 요일 편성). 예: 국어 · 비문학 / 사회 / 과학 / 역사 / 국어 · 문학'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 무료 Supabase는 7일 미사용 시 정지된다. 매일 가벼운 read 1회로 활성 유지.
      # 실패해도(정지/네트워크) 콘텐츠 생성은 계속되도록 continue-on-error.
      - name: Keep Supabase awake
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "$SUPABASE_URL/rest/v1/stats?select=user_id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true
            echo "Supabase keep-alive: HTTP $code"
          else
            echo "Supabase 시크릿 미설정 — keep-alive 건너뜀"
          fi

      # 아이 데이터(entries/stats) 암호화 백업 — 원본은 GET(읽기)만, 절대 수정 안 함.
      # BACKUP_PASSPHRASE로 AES-256 암호화 후 '암호문만' 커밋(평문 커밋 금지). git 이력=영구 보존.
      # 시크릿 미설정이면 건너뜀. 실패해도 콘텐츠 생성 계속(continue-on-error).
      - name: Backup Supabase data (encrypted, read-only)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "백업 시크릿(BACKUP_PASSPHRASE 등) 미설정 — 백업 건너뜀"; exit 0
          fi
          get() { curl -s --max-time 30 "$SUPABASE_URL/rest/v1/$1?select=*" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"; }
          entries=$(get entries); stats=$(get stats)
          # 정상 JSON 배열([)일 때만 백업 — 에러 응답으로 덮어쓰기 방지
          case "$entries" in "["*) ;; *) echo "entries 조회 실패 — 백업 건너뜀"; exit 0;; esac
          case "$stats"   in "["*) ;; *) echo "stats 조회 실패 — 백업 건너뜀"; exit 0;; esac
          mkdir -p backups
          printf '{"exported_at":"%s","entries":%s,"stats":%s}' \
            "$(date -u +%FT%TZ)" "$entries" "$stats" > backups/_plain.json
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backups/_plain.json -out backups/ji-backup.json.enc -pass env:BACKUP_PASSPHRASE
          rm -f backups/_plain.json   # 평문은 절대 남기지 않음
          echo "백업 완료(암호화): $(wc -c < backups/ji-backup.json.enc) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate content (요일제 교과/뉴스) → news.json
        # ANTHROPIC_API_KEY 시크릿이 있으면 교과 생성, 없으면 뉴스로 폴백
        # FORCE_SUBJECT 있으면 요일 무관하게 그 교과 강제(수동 테스트)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_SUBJECT: ${{ inputs.subject }}
        run: node scripts/generate-content.js

      - name: Commit news.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news.json
          git add public/lesson-history.json 2>/dev/null || true   # 중복 방지 원장(없을 수 있음)
          git add backups/ji-backup.json.enc 2>/dev/null || true   # 암호화 데이터 백업(없을 수 있음)
          git diff --cached --quiet || git commit -m "chore: 콘텐츠 자동 생성 $(date +'%Y-%m-%d')"
          git push
